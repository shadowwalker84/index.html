<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ocean Relaxation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(0, 40, 80, 0.25),
                    rgba(0, 10, 30, 0.55)
                ),
                url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;
            background-position: center;
        }

        .overlay {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .box {
            width: 90%;
            max-width: 550px;
            padding: 35px;

            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);

            border-radius: 20px;
        }

        h1 {
            font-size: 38px;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 15px 30px;
            margin-top: 20px;

            border: none;
            border-radius: 12px;

            font-size: 18px;
            cursor: pointer;
        }

        #start {
            background: white;
            color: black;
        }

        #stop {
            background: #ff3333;
            color: white;

            position: fixed;

            transition:
                left 0.15s ease,
                top 0.15s ease;

            display: none;
        }

        #progressContainer {
            width: 100%;
            height: 15px;

            background: rgba(255,255,255,0.25);

            border-radius: 20px;
            overflow: hidden;

            margin-top: 25px;
        }

        #progress {
            width: 0%;
            height: 100%;
            background: white;

            transition: width 0.3s;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            min-height: 30px;
        }

        #escapeBox {
            display: none;
            margin-top: 25px;
        }

        #escapeInput {
            padding: 12px;
            width: 220px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            text-align: center;
        }

        .shake {
            animation: shake 0.15s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(2px, 2px);
            }

            50% {
                transform: translate(-2px, -2px);
            }

            100% {
                transform: translate(2px, -2px);
            }
        }
    </style>
</head>


<body>

<div class="overlay">

    <div class="box" id="box">

        <h1>🌊 Ocean Relaxation</h1>

        <p>
            Welcome to your peaceful ocean experience.
        </p>

        <p>
            Click below to begin.
        </p>

        <button id="start" onclick="startExperience()">
            🌴 Start Relaxation
        </button>

        <div id="progressContainer" style="display:none;">
            <div id="progress"></div>
        </div>

        <div id="message"></div>

        <div id="escapeBox">

            <p>
                🆘 Type <b>STOP</b> to end the prank.
            </p>

            <input
                id="escapeInput"
                type="text"
                placeholder="Type STOP..."
                autocomplete="off"
            >

        </div>

    </div>

</div>


<button id="stop">
    🔇 STOP
</button>


<script>

let audioContext;
let oscillator;
let gainNode;
let soundInterval;

let prankActive = false;


/* -----------------------------
   START EXPERIENCE
----------------------------- */

function startExperience() {

    document.getElementById("start").style.display = "none";

    document.getElementById("progressContainer").style.display = "block";

    let progress = 0;

    const messages = [
        "Preparing your relaxing experience... 🌊",
        "Connecting to the ocean... 🏝️",
        "Listening to the waves... 🌊",
        "Finding the perfect beach... 🏖️",
        "Calibrating relaxation levels...",
        "Almost ready...",
        "Final preparations...",
        "Please continue waiting..."
    ];

    const messageBox =
        document.getElementById("message");

    const loading = setInterval(function() {

        progress += 12.5;

        document.getElementById("progress").style.width =
            progress + "%";

        let index =
            Math.floor(progress / 12.5) - 1;

        if (messages[index]) {
            messageBox.innerHTML =
                messages[index];
        }

        if (progress >= 100) {

            clearInterval(loading);

            messageBox.innerHTML =
                "🌊 Relaxation complete...";

            setTimeout(function() {

                messageBox.innerHTML =
                    "WAIT... SOMETHING WENT WRONG. 😂";

                startAnnoyingSound();

            }, 2000);
        }

    }, 1000);
}


/* -----------------------------
   ANNOYING SOUND
----------------------------- */

function startAnnoyingSound() {

    prankActive = true;

    audioContext =
        new (window.AudioContext ||
        window.webkitAudioContext)();

    oscillator =
        audioContext.createOscillator();

    gainNode =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.value = 600;

    /* Moderate volume */
    gainNode.gain.value = 0.06;

    oscillator.connect(gainNode);

    gainNode.connect(audioContext.destination);

    oscillator.start();


    document.getElementById("stop").style.display =
        "block";

    document.getElementById("escapeBox").style.display =
        "block";

    document.getElementById("box")
        .classList.add("shake");


    const frequencies = [
        450,
        650,
        800,
        550,
        900,
        500
    ];

    let i = 0;

    soundInterval = setInterval(function() {

        oscillator.frequency.value =
            frequencies[i];

        i++;

        if (i >= frequencies.length) {
            i = 0;
        }

    }, 350);


    document.getElementById("message").innerHTML =
        "😂 GOOD LUCK CATCHING THE BUTTON!";
}


/* -----------------------------
   RUN-AWAY STOP BUTTON
----------------------------- */

const stopButton =
    document.getElementById("stop");


stopButton.addEventListener("mouseenter", function() {

    if (!prankActive) return;

    moveStopButton();

});


stopButton.addEventListener("click", function() {

    /*
       If they somehow manage to click it,
       the prank still ends.
    */

    stopPrank();

});


function moveStopButton() {

    const buttonWidth =
        stopButton.offsetWidth;

    const buttonHeight =
        stopButton.offsetHeight;

    const maxX =
        window.innerWidth - buttonWidth - 20;

    const maxY =
        window.innerHeight - buttonHeight - 20;

    const x =
        Math.max(10, Math.random() * maxX);

    const y =
        Math.max(10, Math.random() * maxY);

    stopButton.style.left =
        x + "px";

    stopButton.style.top =
        y + "px";
}


/* -----------------------------
   TYPE STOP TO ESCAPE
----------------------------- */

document
    .getElementById("escapeInput")
    .addEventListener("input", function() {

        const value =
            this.value.trim().toUpperCase();

        if (value === "STOP") {

            stopPrank();

        }

    });


/* -----------------------------
   STOP EVERYTHING
----------------------------- */

function stopPrank() {

    prankActive = false;

    clearInterval(soundInterval);

    if (oscillator) {

        try {
            oscillator.stop();
        } catch (error) {}

    }

    if (audioContext) {

        try {
            audioContext.close();
        } catch (error) {}

    }

    document.getElementById("stop").style.display =
        "none";

    document.getElementById("escapeBox").style.display =
        "none";

    document.getElementById("box")
        .classList.remove("shake");

    document.getElementById("message").innerHTML =
        "😂 YOU ESCAPED! 🌊";

}

</script>

</body>
</html>
